name: Niani Kids Mobile CI
on:
  pull_request:
    branches: [main]
    paths:
      - 'App.tsx'
      - 'src/**'
      - 'scripts/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches: [main]
    paths:
      - 'App.tsx'
      - 'src/**'
      - 'scripts/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile-ci.yml'
permissions:
  contents: read
concurrency:
  group: niani-mobile-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Validate content catalogue
        run: node scripts/validate-content.mjs
      - name: Validate audio catalogue and approval gates
        run: node scripts/validate-audio-catalog.mjs
      - name: Audit Wolof coverage
        run: node scripts/audit-wolof-content.mjs
      - name: Export Android bundle
        run: npx expo export --platform android --output-dir dist-android
      - name: Upload Android export
        uses: actions/upload-artifact@v4
        with:
          name: niani-kids-android-export
          path: dist-android/
          if-no-files-found: error
          retention-days: 7
