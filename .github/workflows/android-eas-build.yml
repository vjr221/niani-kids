name: Niani Kids - Android APK (EAS)
on:
  push:
    branches:
      - main
      - feat/quality-visual-audio-safe-area
  workflow_dispatch:
    inputs:
      profile:
        description: "Profil EAS à utiliser"
        required: true
        type: choice
        options:
          - preview
          - production
        default: preview

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm install

      - name: Générer les icônes et illustrations PNG
        run: npm run assets

      - name: Vérifier TypeScript
        run: npx tsc --noEmit

      - name: Installer EAS CLI avec npm
        run: npm install --global eas-cli

      - name: Vérifier la connexion Expo
        env:
          EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}
        run: eas whoami

      - name: Initialiser ou associer le projet Expo
        env:
          EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}
        run: eas init --account vjr221s-team --non-interactive

      - name: Construire l’application Android
        env:
          EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}
        run: eas build --platform android --profile "${{ inputs.profile }}" --non-interactive --wait
