name: Niani Kids - Android APK (EAS)
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Profil EAS à utiliser"
        required: true
        type: choice
        options:
          - preview
          - production
        default: preview
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Vérifier TypeScript
        run: npx tsc --noEmit
      - name: Configurer EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EAS_TOKEN }}
      - name: Construire l’application Android
        run: eas build --platform android --profile "${{ inputs.profile }}" --non-interactive --wait
