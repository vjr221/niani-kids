name: Niani Kids - Android APK (EAS)
on:
  workflow_run:
    workflows: ["Niani Kids - Quality Check"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: "Profil EAS à utiliser"
        required: true
        type: choice
        options:
          - preview
          - production
        default: preview

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm install

      - name: Vérifier TypeScript
        run: npx tsc --noEmit

      - name: Installer EAS CLI avec npm
        run: npm install --global eas-cli

      - name: Vérifier la connexion Expo
        env:
          EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}
        run: eas whoami

      - name: Initialiser ou associer le projet Expo
        env:
          EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}
        run: eas init --account vjr221s-team --non-interactive

      - name: Déterminer le profil de build
        id: profile
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.profile }}" == "production" ]]; then
            echo "name=production" >> "$GITHUB_OUTPUT"
          else
            echo "name=preview" >> "$GITHUB_OUTPUT"
          fi

      - name: Construire l’application Android
        env:
          EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}
        run: eas build --platform android --profile "${{ steps.profile.outputs.name }}" --non-interactive --wait
