name: Niani Kids Android Release (Local Gradle)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: niani-kids-android-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_AUDIO_REVIEW: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20.19.0, cache: npm}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node scripts/validate-content.mjs
      - run: node scripts/validate-audio-catalog.mjs
      - run: node scripts/audit-wolof-content.mjs
      - name: Configure private Android release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name. Configure the four Android signing secrets before building a public APK."
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/niani-kids-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
      - run: npx expo prebuild --platform android --clean --no-install
      - run: npx expo export:embed --platform android --dev false --entry-file node_modules/expo/AppEntry.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res
      - working-directory: android
        run: ./gradlew --no-daemon assembleRelease
      - name: Verify production APK and checksum
        id: apk
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK" > "$APK.sha256"
          echo "version=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"
          echo "tag=android-v$(node -p "require('./app.json').expo.version")-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: niani-kids-android-v${{ steps.apk.outputs.version }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.apk.outputs.tag }}
          VERSION: ${{ steps.apk.outputs.version }}
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          CHECKSUM="$APK.sha256"
          NOTES="APK Android Niani Kids v${VERSION}, signée avec le keystore privé de production. Distribution directe depuis nianikids.com (hors Google Play). Empreinte SHA-256 fournie."
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; updating its assets."
            gh release edit "$TAG" --title "Niani Kids Android v${VERSION}" --notes "$NOTES"
            gh release upload "$TAG" "$APK#Niani-Kids-${VERSION}.apk" "$CHECKSUM#Niani-Kids-${VERSION}.sha256" --clobber
          else
            gh release create "$TAG" "$APK#Niani-Kids-${VERSION}.apk" "$CHECKSUM#Niani-Kids-${VERSION}.sha256" --target "$GITHUB_SHA" --title "Niani Kids Android v${VERSION}" --notes "$NOTES"
          fi
