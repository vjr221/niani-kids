name: Bootstrap reproducible npm lockfile

on:
  push:
    branches:
      - audit/sprint-1-release-hardening
    paths:
      - ".github/workflows/bootstrap-lockfile.yml"
      - "package.json"

permissions:
  contents: write

concurrency:
  group: niani-lockfile-bootstrap
  cancel-in-progress: false

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/sprint-1-release-hardening
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts
      - name: Install exactly from lockfile
        run: npm ci
      - name: Check Expo dependency compatibility
        run: npx expo install --check
      - name: TypeScript
        run: npm run typecheck
      - name: Validate translations
        run: node scripts/validate-translations.mjs
      - name: Validate content
        run: node scripts/validate-content.mjs
      - name: Validate audio catalog
        run: node scripts/validate-audio-catalog.mjs
      - name: Export Android bundle
        run: npx expo export --platform android
      - name: Commit verified lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
          else
            git commit -m "build: add verified npm lockfile"
            git push origin HEAD:audit/sprint-1-release-hardening
          fi
