name: Niani Kids - Android Preview (modernization branch)

on:
  push:
    branches:
      - feat/niani-kids-modernization-oct-2026
    paths:
      - "App.tsx"
      - "app.json"
      - "eas.json"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "assets/**"
      - "scripts/**"
      - ".github/workflows/android-preview-feature.yml"
      - ".github/workflows/quality.yml"

permissions:
  contents: read

jobs:
  preview:
    name: Validate and build Android preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Show source revision
        run: echo "Building source commit ${GITHUB_SHA}"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Check Expo dependency compatibility
        run: npx expo install --check
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Validate translations
        run: node scripts/validate-translations.mjs
      - name: Validate content
        run: node scripts/validate-content.mjs
      - name: Audit Wolof content coverage
        run: npm run audit:wolof
      - name: Audit Wolof learning program coverage
        run: node scripts/audit-wolof-program.mjs
      - name: Validate audio catalog
        run: node scripts/validate-audio-catalog.mjs
      - name: Export Android bundle
        run: npx expo export --platform android
      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive --no-install
      - name: Build installable Android release APK with embedded JavaScript
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease
      - name: Upload Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: niani-kids-android-release-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
