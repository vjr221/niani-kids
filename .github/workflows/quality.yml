name: Niani Kids - Quality Check
on:
  push:
    branches:
      - main
      - feat/niani-kids-modernization-oct-2026
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx tsc --noEmit
      - run: node scripts/validate-translations.mjs
      - run: node scripts/validate-content.mjs
      - run: node scripts/validate-audio-catalog.mjs
      - run: npx expo export --platform android
