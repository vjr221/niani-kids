name: Deploy Niani Kids website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "assets/**"
      - "docs/IDENTITE-VISUELLE.md"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static website
        run: |
          mkdir -p dist/assets
          cp website/index.html dist/index.html
          sed -i 's#../assets/#assets/#g' dist/index.html
          cp -R assets/. dist/assets/
          test -s dist/index.html
          test -s dist/assets/a_clean_graphic_png_logo_on_a_transparent_backgrou.png

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
