name: Extract Niani Kids reference pack

on:
  push:
    branches:
      - chore/extract-reference-pack
    paths:
      - 'assets/.extract-reference-pack'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/extract-reference-pack
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract reference assets
        run: |
          test -f assets/Niani_Kids_Transfert_GitHub_Pret.zip
          unzip -o assets/Niani_Kids_Transfert_GitHub_Pret.zip -d .
          rm assets/Niani_Kids_Transfert_GitHub_Pret.zip
          rm -f assets/.extract-reference-pack
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets
          git diff --cached --quiet && exit 0
          git commit -m "Extract Niani Kids brand and character reference assets"
          git push origin chore/extract-reference-pack
